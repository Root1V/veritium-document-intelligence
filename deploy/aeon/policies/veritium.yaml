# Veritium's Cedar bundle: tenant `veritium` (the file name IS the tenant,
# aeon GOV-001d). Default-deny:
# only these permits exist. Each permit carries the `resource is
# ExternalActivity` type guard (RUN-006): without it, a tool with the same
# name would inherit the permit. Activity names and task queues must match
# src/idp/execution/aeon.py (a unit test checks it).
apiVersion: harness.ai/v1
kind: PolicyBundle
cedarVersion: "4.0"
policies:
  - id: allow-veritium-case-steps
    effect: permit
    cedarSource: |
      permit(
        principal == Agent::"veritium-case-run@1.0.0",
        action,
        resource
      ) when {
        resource is ExternalActivity &&
        ["veritium.case.start_run", "veritium.case.process_document", "veritium.case.evaluate"].contains(resource.name) &&
        ["veritium-online", "veritium-backoffice", "veritium-bulk"].contains(resource.task_queue)
      };
  # VRT-55: Veritium's tools federated through aeon-toolgw (tool_sources.yaml).
  # Reads are open to the assistant agent (POST /execute, per agent) and to MCP
  # clients (aeon's /mcp door has one principal for every MCP client). Writes
  # (submit_case, add_documents, read_with_lens) have no permit: default deny,
  # until a real agent needs one and gets its own permit.
  - id: allow-veritium-tool-reads-assistant
    effect: permit
    cedarSource: |
      permit(
        principal == Agent::"veritium-assistant@1.0.0",
        action,
        resource
      ) when {
        resource is Tool &&
        ["veritium.list_processes", "veritium.find_cases", "veritium.cases_overview", "veritium.get_case_status",
         "veritium.get_case_result", "veritium.get_field_evidence", "veritium.get_review_queue", "veritium.list_lenses",
         "veritium.quick_check_document"].contains(resource.name)
      };
  - id: allow-veritium-tool-reads-mcp
    effect: permit
    cedarSource: |
      permit(
        principal == McpClient::"external-mcp-client",
        action,
        resource
      ) when {
        resource is Tool &&
        ["veritium.list_processes", "veritium.find_cases", "veritium.cases_overview", "veritium.get_case_status",
         "veritium.get_case_result", "veritium.get_field_evidence", "veritium.get_review_queue", "veritium.list_lenses",
         "veritium.quick_check_document"].contains(resource.name)
      };
